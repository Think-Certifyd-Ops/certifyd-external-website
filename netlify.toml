[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/podcast/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://rogerson-signups.netlify.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self'; connect-src 'self' https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googletagmanager.com https://region1.google-analytics.com https://rogerson-signups.netlify.app; frame-src https://app.cal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# ── /sponsors → Certifyd Sponsor Register app (proxied, keeps SEO on the brand domain) ──
[[redirects]]
  from = "/sponsors"
  to = "https://certifyd-sponsors.netlify.app/sponsors"
  status = 200
  force = true

[[redirects]]
  from = "/sponsors/*"
  to = "https://certifyd-sponsors.netlify.app/sponsors/:splat"
  status = 200
  force = true

# ── API → Netlify Functions ────────────────────────────────
[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200


