[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/podcast/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self'; connect-src 'self' https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googletagmanager.com https://region1.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# ── /sponsors → Certifyd Sponsor Register app (proxied, keeps SEO on the brand domain) ──
[[redirects]]
  from = "/sponsors"
  to = "https://certifyd-sponsors.netlify.app/sponsors"
  status = 200
  force = true

[[redirects]]
  from = "/sponsors/*"
  to = "https://certifyd-sponsors.netlify.app/sponsors/:splat"
  status = 200
  force = true

# ── API → Netlify Functions ────────────────────────────────
[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200

# ── Redirects ──────────────────────────────────────────────
# Removed pages
[[redirects]]
  from = "/updates"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/updates/"
  to = "/blog/"
  status = 301

# Old blog post → new URL (matching content imported)
[[redirects]]
  from = "/blog/whos-really-at-your-door-hidden-risk-letting-strangers-into-home"
  to = "/blog/whos-really-at-your-door/"
  status = 301

# ── Solutions → Products redirects ─────────────────────────
[[redirects]]
  from = "/solutions/person"
  to = "/products/codewords/"
  status = 301

[[redirects]]
  from = "/solutions/person/"
  to = "/products/codewords/"
  status = 301

[[redirects]]
  from = "/solutions/business"
  to = "/products/portal/"
  status = 301

[[redirects]]
  from = "/solutions/business/"
  to = "/products/portal/"
  status = 301

[[redirects]]
  from = "/solutions/compliance"
  to = "/products/portal/"
  status = 301

[[redirects]]
  from = "/solutions/compliance/"
  to = "/products/portal/"
  status = 301

[[redirects]]
  from = "/solutions/*"
  to = "/products/"
  status = 301

# ── RTW → Portal redirect ─────────────────────────────────
[[redirects]]
  from = "/rtw"
  to = "/products/portal/"
  status = 301

[[redirects]]
  from = "/rtw/"
  to = "/products/portal/"
  status = 301

# ── Onboarding → Home redirects ───────────────────────────
[[redirects]]
  from = "/onboarding/person"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding/person/"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding/organisation"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding/organisation/"
  to = "/"
  status = 301

# Catch-all: old pre-pivot blog slugs → blog index
[[redirects]]
  from = "/blog/*"
  to = "/blog/"
  status = 301
