name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:workload
      - run: npm run test:measurement
      - run: npm run test:connected
      - run: npm run test:attribution
      - run: npm run build
      - run: python3 scripts/check-site-architecture.py
      - run: npm audit --omit=dev --audit-level=high
